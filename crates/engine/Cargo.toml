[package]
name = "engine"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "LOUDAUTO's engine (loudautod): owns playback, MPRIS, the tray and the caches"

[[bin]]
name = "loudautod"
path = "src/main.rs"

[dependencies]
engine-ipc.workspace = true
playback.workspace = true
spot-core.workspace = true
# The global heart key (GlobalShortcuts portal): zbus 6 on tokio, as mpris-server's.
ashpd.workspace = true
async-trait.workspace = true
env_logger.workspace = true
futures-util.workspace = true
# The icon names the tray and notifications show (shared with the window).
icon-theme.workspace = true
# The tray (StatusNotifierItem), on tokio.
ksni.workspace = true
librespot-core.workspace = true
log.workspace = true
# Signalling a window that won't close.
nix.workspace = true
# Also sleep.rs's zbus (6, its re-export), so sleep.rs needs no zbus dependency of its own.
mpris-server = { workspace = true, features = ["tokio"] }
# zbus 5 on tokio, as ksni (the tray) uses it: no async-io executor beside the runtime.
notify-rust = { workspace = true, features = ["z-with-tokio"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile.workspace = true
# The soloist tests stand in for Soloist's WebSocket.
tokio-tungstenite.workspace = true
