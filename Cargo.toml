[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT"

[workspace.dependencies]
# librespot: pinned dev commit (crates.io 0.8.0 does not build, librespot#1760)
librespot-core = { git = "https://github.com/librespot-org/librespot", rev = "99b6088bf3ea028f90192676ac1a337fa4b2ed12", default-features = false, features = ["native-tls"] }
librespot-oauth = { git = "https://github.com/librespot-org/librespot", rev = "99b6088bf3ea028f90192676ac1a337fa4b2ed12", default-features = false, features = ["native-tls"] }
librespot-metadata = { git = "https://github.com/librespot-org/librespot", rev = "99b6088bf3ea028f90192676ac1a337fa4b2ed12", default-features = false }
librespot-protocol = { git = "https://github.com/librespot-org/librespot", rev = "99b6088bf3ea028f90192676ac1a337fa4b2ed12", default-features = false }
protobuf = "3.7"
protobuf-json-mapping = "3.7"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "time", "sync", "process", "net", "io-util", "fs", "signal"] }
thiserror = "2"
log = "0.4"
serde_json = "1"
percent-encoding = "2"
async-trait = "0.1"
oo7 = "0.7"
tempfile = "3"
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
# 0.28 is the version librespot already pulls in
tokio-tungstenite = "0.28"
futures-util = "0.3"
nix = { version = "0.31", features = ["signal", "process"] }
# Phase 4 (desktop app). eframe: glow only, no wgpu (the 2026-11-06 spike: first frame
# 184 ms vs 329 ms, 84 MB vs 108 MB); default_fonts as in the spike, so text renders
# before the desktop font loads.
eframe = { version = "0.37", default-features = false, features = ["glow", "wayland", "default_fonts"] }
egui = "0.37"
egui_kittest = "0.37"
# The font parser epaint 0.37 uses (keep in step with it): the window checks a system font
# parses before handing it to egui, which panics on one it can't read.
skrifa = { version = "0.44", default-features = false, features = ["std"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
lru = "0.19"
ksni = { version = "0.3.7", features = ["tokio"] }
mpris-server = "0.11"
ashpd = { version = "0.14", default-features = false, features = ["tokio", "global_shortcuts"] }
# Members pick the backend: "z" (async-io) or "z-with-tokio".
notify-rust = { version = "4.18", default-features = false }
wiremock = "0.6"
regex = "1"
# 0.9 with thread_rng is what librespot-core already pulls in
rand = { version = "0.9", default-features = false, features = ["thread_rng"] }
# 0.12 is already in the lockfile through librespot-oauth
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json"] }
# 0.10 is already in the lockfile through oauth2 (librespot-oauth)
sha2 = "0.10"
spot-core = { path = "crates/spot-core" }
playback = { path = "crates/playback" }
engine-ipc = { path = "crates/engine-ipc" }
engine = { path = "crates/engine" }
icon-theme = { path = "crates/icon-theme" }
